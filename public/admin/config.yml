local_backend: true
backend:
  name: github
  repo: jauhar-nr/mafia-kumat-website
  branch: master

media_folder: "public/media"
public_folder: "/media"

collections:
  - name: "chapters"
    label: "Materi Belajar"
    folder: "src/app/materi/(chapters)"
    create: true
    path: "{{slug}}/page"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - label: "Judul Materi"
        name: "title"
        widget: "string"

      - label: "Lintasan Belajar"
        name: "track"
        widget: "select"
        options:
          - "Matematika Esensial Fisika"
          - "Fisika & Mekanika Kuantum"
          - "Mekanika Klasik"
          - "Kuantum Material"
        default: "Fisika & Mekanika Kuantum"

      - label: "Nomor Urut dalam Lintasan"
        name: "order"
        widget: "number"
        value_type: "int"

      - label: "Deskripsi Singkat"
        name: "description"
        widget: "text"

      - label: "Isi Materi"
        name: "body"
        widget: "markdown"
        hint: 'Ketik: <GDrivePDF id="ID_DRIVE" title="Judul" /> untuk menyisipkan PDF dari Google Drive.'
